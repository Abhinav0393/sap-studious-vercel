          <a href="assets/images/architecture/bhumireddy-mansion/elevation-01-1920.jpg"><picture><source type="image/webp" srcset="assets/images/architecture/bhumireddy-mansion/elevation-01-800.webp 800w, assets/images/architecture/bhumireddy-mansion/elevation-01-1600.webp 1600w, assets/images/architecture/bhumireddy-mansion/elevation-01-1920.webp 1920w" sizes="(min-width:900px) 50vw, 100vw"><img src="assets/images/architecture/bhumireddy-mansion/elevation-01-1920.jpg" srcset="assets/images/architecture/bhumireddy-mansion/elevation-01-800.jpg 800w, assets/images/architecture/bhumireddy-mansion/elevation-01-1600.jpg 1600w, assets/images/architecture/bhumireddy-mansion/elevation-01-1920.jpg 1920w" sizes="(min-width:900px) 50vw, 100vw" alt="Three-quarter view of the neoclassical front elevation with columns, arched balconies and a landscaped forecourt" width="1920" height="1080" loading="lazy" decoding="async"></picture></a>
          <h2>Bhumireddy Mansion</h2>
          <p class="ns-meta">Residential · 4BHK Villa · Proddatur · Ongoing · 4,856 sq.ft.</p>
          <p>Bhumi Reddy Mansion is an ongoing 4,856 sq.ft. 4BHK villa in Proddatur that reinterprets neoclassical architecture through a contemporary lens. The residence combines classical columns, arched openings, ornamental detailing, strong vertical volumes, and refined moulded profiles with a restrained palette of textured stone and lime-wash finishes. A dramatic double-height foyer, landscaped balconies, and carefully integrated greenery add depth and soften the formal character of the facade. The result is a grand yet refined residence that brings together classical elegance, contemporary restraint, and timeless architectural character.</p>
        </li>
        <li class="ns-item">
          <a href="assets/images/architecture/manoj-residence/elevation-01-1920.jpg"><picture><source type="image/webp" srcset="assets/images/architecture/manoj-residence/elevation-01-800.webp 800w, assets/images/architecture/manoj-residence/elevation-01-1600.webp 1600w, assets/images/architecture/manoj-residence/elevation-01-1920.webp 1920w" sizes="(min-width:900px) 50vw, 100vw"><img src="assets/images/architecture/manoj-residence/elevation-01-1920.jpg" srcset="assets/images/architecture/manoj-residence/elevation-01-800.jpg 800w, assets/images/architecture/manoj-residence/elevation-01-1600.jpg 1600w, assets/images/architecture/manoj-residence/elevation-01-1920.jpg 1920w" sizes="(min-width:900px) 50vw, 100vw" alt="Front elevation of the contemporary villa with stone, plaster and timber surfaces and planted balconies" width="1920" height="1281" loading="lazy" decoding="async"></picture></a>
          <h2>Manoj Residence</h2>
          <p class="ns-meta">Residential · 3BHK Villa · Proddatur · Ongoing · 2,206 sq.ft.</p>
          <p>Manoj Residence is a 2,206 sq.ft. contemporary 3BHK villa in Proddatur, designed as a complete architectural project with a focus on clean geometry, material warmth, and a strong connection with the outdoors.</p>
          <p>The facade brings together large planes of textured stone, crisp plastered surfaces, warm wood accents, and deep roof overhangs to create a balanced contemporary expression. Carefully integrated greenery across the balconies and landscape softens the architecture while adding a tropical character to the residence.</p>
          <p>Inside, the planning is organised around a spacious living area with a visually connected staircase and double-height volume, creating a sense of openness and vertical continuity. The ground floor brings together the living, dining, kitchen, puja, and master bedroom, while the first floor accommodates the master bedroom, children&#x27;s bedroom, and a private lounge with balconies.</p>
          <p>The interiors continue the architectural language through warm wood tones, soft neutral finishes, natural textures, and carefully framed openings that bring daylight and landscape into the home. The result is a contemporary family residence that balances simplicity, warmth, functionality, and a strong sense of place.</p>
        </li>
        <li class="ns-item">
          <a href="assets/images/architecture/ravi-teja-residence/elevation-01-1103.jpg"><picture><source type="image/webp" srcset="assets/images/architecture/ravi-teja-residence/elevation-01-800.webp 800w, assets/images/architecture/ravi-teja-residence/elevation-01-1103.webp 1103w" sizes="(min-width:900px) 50vw, 100vw"><img src="assets/images/architecture/ravi-teja-residence/elevation-01-1103.jpg" srcset="assets/images/architecture/ravi-teja-residence/elevation-01-800.jpg 800w, assets/images/architecture/ravi-teja-residence/elevation-01-1103.jpg 1103w" sizes="(min-width:900px) 50vw, 100vw" alt="Townhouse elevation with timber screens, concrete fins and a skylight, seen from the street after rain" width="1103" height="1426" loading="lazy" decoding="async"></picture></a>
          <h2>Ravi Teja Residence</h2>
          <p class="ns-meta">Residential · 4BHK Villa · Proddatur · Ongoing · 3,441 sq.ft.</p>
          <p>Ravi Teja Residence is an ongoing 3,441 sq.ft. 4BHK villa in Proddatur, designed as a contemporary urban home with a focus on privacy, natural light, and climatic responsiveness. Clean architectural volumes are layered with warm wooden screens, aluminium louvers, concrete fins, and planted balconies to create depth and texture across the facade. Carefully positioned openings, voids, and a skylight bring natural light into the vertically organised interior, while the screening elements filter sunlight and provide privacy. The result is a contemporary residence that balances clean geometry, warmth, greenery, and functional design.</p>
